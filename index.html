<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pointless</title>
<style>
  :root{
    --ink:#0D1B3E; --ink2:#152551; --ink3:#1C2F63;
    --line:#2C3E72; --paper:#EEF1F8; --muted:#93A2C9;
    --gold:#F5C842; --mint:#5BE7A9; --red:#FF7A7A;
    --pad:18px;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--paper); font-family:var(--sans)}
  body{min-height:100dvh; padding:var(--pad) var(--pad) 48px; line-height:1.45}
  .wrap{max-width:560px; margin:0 auto}
  .wide{max-width:820px}
  h1{font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; margin:0 0 4px}
  h2{font-size:1.05rem; font-weight:700; letter-spacing:-0.01em; margin:26px 0 10px; color:var(--paper)}
  p{margin:0 0 12px}
  .sub{color:var(--muted); font-size:.92rem; margin:0 0 20px}
  .topic{font-size:2rem; font-weight:800; letter-spacing:-0.03em; line-height:1.1; margin:0 0 6px}

  input,textarea,select,button{font-family:inherit; font-size:1rem}
  input,textarea,select{
    width:100%; padding:13px 14px; background:var(--ink2); color:var(--paper);
    border:1px solid var(--line); border-radius:10px; outline:none
  }
  input:focus,textarea:focus,select:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,200,66,.18)}
  textarea{min-height:130px; resize:vertical; line-height:1.5}
  label{display:block; font-size:.85rem; color:var(--muted); margin:14px 0 6px}

  button{
    display:block; width:100%; padding:15px 16px; border-radius:10px; border:1px solid transparent;
    background:var(--gold); color:#231A00; font-weight:750; cursor:pointer
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{background:transparent; color:var(--paper); border-color:var(--line)}
  button.danger{background:transparent; color:var(--red); border-color:var(--line)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .row{display:flex; gap:8px}
  .row>*{flex:1}

  .clock{display:flex; align-items:baseline; gap:10px; margin:4px 0 10px}
  .clock b{font-size:3.4rem; font-weight:800; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; line-height:1}
  .clock span{color:var(--muted); font-size:.9rem}
  .track{height:6px; background:var(--ink3); border-radius:99px; overflow:hidden; margin-bottom:18px}
  .fill{height:100%; background:var(--gold); width:100%}
  .track.low .fill{background:var(--red)}

  .sugg{border:1px solid var(--line); border-radius:10px; margin-top:8px; overflow:hidden}
  .sugg div{padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer}
  .sugg div:last-child{border-bottom:none}
  .sugg div:hover,.sugg div.on{background:var(--ink3)}

  ul.given{list-style:none; padding:0; margin:16px 0 0; display:flex; flex-wrap:wrap; gap:8px}
  ul.given li{
    background:var(--ink2); border:1px solid var(--line); border-radius:99px;
    padding:7px 12px; font-size:.9rem; display:flex; align-items:center; gap:8px
  }
  ul.given li button{width:auto; padding:0 2px; background:none; color:var(--muted); font-weight:700; border:none}
  .count{color:var(--muted); font-size:.85rem; margin-top:14px}

  .score{text-align:center; padding:26px 0 10px}
  .score b{
    display:block; font-size:6.5rem; font-weight:800; letter-spacing:-0.05em; line-height:.9;
    font-variant-numeric:tabular-nums; color:var(--gold)
  }
  .score.zero b{color:var(--mint)}
  .score em{display:block; font-style:normal; color:var(--muted); font-size:.9rem; margin-top:14px}
  .bar{height:14px; background:var(--ink3); border-radius:99px; overflow:hidden; margin:20px 0 4px}
  .bar i{display:block; height:100%; background:var(--gold); width:0%}
  .score.zero .bar i{background:var(--mint)}

  table{width:100%; border-collapse:collapse; font-size:.95rem}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:.82rem}
  td.n{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chips span{background:var(--ink2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:.85rem}

  .item{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px}
  .item p{margin:0 0 10px; font-size:.95rem}
  .item .muted{color:var(--muted)}
  .msg{border-left:3px solid var(--gold); padding:10px 0 10px 12px; margin:14px 0; color:var(--paper); font-size:.94rem}
  .msg.bad{border-color:var(--red)}
  .msg.good{border-color:var(--mint)}
  a{color:var(--gold)}
  .code{font-variant-numeric:tabular-nums; letter-spacing:.12em; font-weight:800; font-size:1.6rem}
  .foot{margin-top:34px; color:var(--muted); font-size:.82rem}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
  var CONFIG = {
    URL: "https://grwihhxbwfcwpvyqpdkr.supabase.co",
    KEY: "sb_publishable_x8f1dkvo-EkMdBxz98vzZA_eNTrKqGN"
  };
</script>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");

  function rpc(fn, args) {
    return fetch(CONFIG.URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": CONFIG.KEY,
        "Authorization": "Bearer " + CONFIG.KEY
      },
      body: JSON.stringify(args || {})
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || ("HTTP " + r.status)); });
      return r.json();
    });
  }

  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
      return v;
    } catch (e) { return null; }
  }

  function deviceToken() {
    var t = store("pointless_device");
    if (!t) {
      t = "d-" + (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
      store("pointless_device", t);
    }
    return t;
  }

  function norm(s) {
    return String(s || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " and ").replace(/[-/_+]/g, " ")
      .replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function clear() { app.innerHTML = ""; app.className = "wrap"; }
  function note(text, kind) { return el("div", { "class": "msg " + (kind || ""), text: text }); }
  function go(hash) { location.hash = hash; }

  // ---------------------------------------------------------------- landing

  function viewHome() {
    clear();
    app.appendChild(el("h1", { text: "Pointless" }));
    app.appendChild(el("p", { "class": "sub", text: "Enter the round code from the team channel." }));
    var input = el("input", { placeholder: "Round code", autocapitalize: "characters", maxlength: "5" });
    app.appendChild(input);
    app.appendChild(el("div", { style: "height:12px" }));
    app.appendChild(el("button", {
      text: "Join round",
      onclick: function () {
        var c = input.value.trim().toUpperCase();
        if (c) go("#/play/" + c);
      }
    }));
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { var c = input.value.trim().toUpperCase(); if (c) go("#/play/" + c); } });
    app.appendChild(el("div", { "class": "foot", html: 'Running the game? <a href="#/admin">Open the control room</a>.' }));
  }

  // ---------------------------------------------------------------- play

  function viewPlay(code) {
    clear();
    app.appendChild(el("p", { "class": "sub", text: "Loading round " + code }));

    rpc("pointless_get_round", { p_join_code: code }).then(function (r) {
      if (!r.ok) return renderPlayClosed(code, "That code does not match any round. Check the link in the channel.");
      if (r.status === "draft") return renderPlayClosed(code, "This round has not opened yet. Try again once it goes live.");
      if (r.status !== "open") return renderPlayClosed(code, "Submissions are closed for this round. The answers get revealed on the call.");
      if (store("pointless_done_" + code)) return renderPlayClosed(code, "You have already played this round. One go each.");
      renderPlayIntro(code, r);
    }).catch(function (e) {
      renderPlayClosed(code, "Could not reach the server. Check your connection and reload.");
    });
  }

  function renderPlayClosed(code, message) {
    clear();
    app.appendChild(el("h1", { text: "Pointless" }));
    app.appendChild(el("div", { "class": "code", text: code }));
    app.appendChild(note(message));
  }

  function renderPlayIntro(code, r) {
    clear();
    app.appendChild(el("p", { "class": "sub", text: "Round " + code + (r.week ? " \u00b7 week " + r.week : "") }));
    app.appendChild(el("div", { "class": "topic", text: r.topic }));
    app.appendChild(el("p", {
      text: "You get " + r.timer_seconds + " seconds to name as many as you can. Type fast, spelling does not need to be perfect."
    }));
    app.appendChild(el("p", { "class": "sub", text: "Your answers stay anonymous. They set the scores the contestants play against." }));

    var name = el("input", { placeholder: "Your name (optional)", value: store("pointless_name") || "" });
    app.appendChild(el("label", { text: "Name, if you want the credit" }));
    app.appendChild(name);
    app.appendChild(el("div", { style: "height:16px" }));
    app.appendChild(el("button", {
      text: "Start the clock",
      onclick: function () {
        if (name.value.trim()) store("pointless_name", name.value.trim());
        renderPlayRun(code, r, name.value.trim());
      }
    }));
  }

  function renderPlayRun(code, r, displayName) {
    clear();
    var answers = r.answers || [];
    var given = [];
    var endsAt = Date.now() + r.timer_seconds * 1000;
    var finished = false;

    var clockNum = el("b", { text: String(r.timer_seconds) });
    var track = el("div", { "class": "track" });
    var fill = el("i", { "class": "fill" });
    track.appendChild(fill);

    app.appendChild(el("div", { "class": "topic", text: r.topic }));
    app.appendChild(el("div", { "class": "clock" }, [clockNum, el("span", { text: "seconds left" })]));
    app.appendChild(track);

    var input = el("input", {
      placeholder: "Type an answer, then Enter",
      autocomplete: "off", autocorrect: "off", autocapitalize: "words", spellcheck: "false"
    });
    app.appendChild(input);
    var sugg = el("div", { "class": "sugg", style: "display:none" });
    app.appendChild(sugg);

    var list = el("ul", { "class": "given" });
    var count = el("div", { "class": "count", text: "0 answers" });
    app.appendChild(list);
    app.appendChild(count);

    var doneBtn = el("button", { text: "I am done", "class": "ghost", style: "margin-top:20px", onclick: function () { finish(); } });
    app.appendChild(doneBtn);

    function redraw() {
      list.innerHTML = "";
      given.forEach(function (g, i) {
        list.appendChild(el("li", {}, [
          el("span", { text: g }),
          el("button", { text: "\u00d7", title: "Remove", onclick: function () { given.splice(i, 1); redraw(); input.focus(); } })
        ]));
      });
      count.textContent = given.length + (given.length === 1 ? " answer" : " answers");
    }

    function add(value) {
      var v = String(value || "").trim();
      if (!v) return;
      var n = norm(v);
      if (!n) return;
      if (given.some(function (g) { return norm(g) === n; })) { input.value = ""; showSugg(""); return; }
      given.push(v);
      input.value = "";
      showSugg("");
      redraw();
    }

    function showSugg(q) {
      sugg.innerHTML = "";
      var n = norm(q);
      if (!n || n.length < 1) { sugg.style.display = "none"; return; }
      var starts = [], contains = [];
      for (var i = 0; i < answers.length; i++) {
        var an = norm(answers[i]);
        if (an.indexOf(n) === 0) starts.push(answers[i]);
        else if (an.indexOf(n) > -1) contains.push(answers[i]);
        if (starts.length >= 6) break;
      }
      var out = starts.concat(contains).slice(0, 6).filter(function (a) {
        return !given.some(function (g) { return norm(g) === norm(a); });
      });
      if (!out.length) { sugg.style.display = "none"; return; }
      out.forEach(function (a) {
        sugg.appendChild(el("div", { text: a, onclick: function () { add(a); input.focus(); } }));
      });
      sugg.style.display = "block";
    }

    input.addEventListener("input", function () { showSugg(input.value); });
    input.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      var first = sugg.querySelector("div");
      if (first && norm(first.textContent).indexOf(norm(input.value)) === 0) add(first.textContent);
      else add(input.value);
    });
    setTimeout(function () { input.focus(); }, 60);

    var tick = setInterval(function () {
      var left = Math.max(0, endsAt - Date.now());
      var secs = Math.ceil(left / 1000);
      clockNum.textContent = String(secs);
      fill.style.width = (left / (r.timer_seconds * 1000) * 100).toFixed(2) + "%";
      if (secs <= 10) track.classList.add("low"); else track.classList.remove("low");
      if (left <= 0) finish();
    }, 100);

    function finish() {
      if (finished) return;
      finished = true;
      clearInterval(tick);
      doneBtn.disabled = true;
      input.disabled = true;

      clear();
      app.appendChild(el("div", { "class": "topic", text: r.topic }));
      app.appendChild(el("p", { "class": "sub", text: "Time. Sending " + given.length + (given.length === 1 ? " answer." : " answers.") }));

      rpc("pointless_submit", {
        p_join_code: code,
        p_device_token: deviceToken(),
        p_display_name: displayName || null,
        p_answers: given
      }).then(function (res) {
        clear();
        app.appendChild(el("div", { "class": "topic", text: r.topic }));
        if (res.ok) {
          store("pointless_done_" + code, "1");
          app.appendChild(note("Answers in. " + res.accepted + " counted. Scores get revealed on the call.", "good"));
        } else if (res.error === "already_submitted") {
          store("pointless_done_" + code, "1");
          app.appendChild(note("You had already played this round, so this go was not counted.", "bad"));
        } else if (res.error === "round_not_open") {
          app.appendChild(note("Submissions closed while you were playing, so this go did not count.", "bad"));
        } else {
          app.appendChild(note("Something went wrong sending your answers: " + res.error, "bad"));
        }
        if (given.length) {
          var chips = el("div", { "class": "chips" });
          given.forEach(function (g) { chips.appendChild(el("span", { text: g })); });
          app.appendChild(el("h2", { text: "What you said" }));
          app.appendChild(chips);
        }
      }).catch(function () {
        clear();
        app.appendChild(note("Could not reach the server, so your answers did not send. Reload and try again if the round is still open.", "bad"));
      });
    }
  }

  // ---------------------------------------------------------------- host

  function adminKeyFor(code) { return store("pointless_key_" + code); }

  function viewHost(code) {
    clear();
    app.className = "wrap wide";
    var key = adminKeyFor(code);
    if (!key) {
      app.appendChild(el("h1", { text: "Host controls" }));
      app.appendChild(el("p", { "class": "sub", text: "Paste the host key for round " + code + ". It is stored on this device only." }));
      var k = el("input", { placeholder: "Host key" });
      app.appendChild(k);
      app.appendChild(el("div", { style: "height:12px" }));
      app.appendChild(el("button", {
        text: "Save key", onclick: function () {
          if (k.value.trim()) { store("pointless_key_" + code, k.value.trim()); viewHost(code); }
        }
      }));
      return;
    }

    app.appendChild(el("h1", { text: "Round " + code }));
    var status = el("p", { "class": "sub", text: "Loading" });
    app.appendChild(status);

    var controls = el("div", { "class": "row", style: "margin-bottom:8px" });
    ["open", "closed", "revealed"].forEach(function (s) {
      controls.appendChild(el("button", {
        "class": "ghost", text: s === "open" ? "Open" : s === "closed" ? "Close" : "Reveal",
        onclick: function () {
          rpc("pointless_admin_set_status", { p_join_code: code, p_admin_key: key, p_status: s })
            .then(function () { viewHost(code); });
        }
      }));
    });
    app.appendChild(controls);

    app.appendChild(el("h2", { text: "Play the answer" }));
    var team = el("input", { placeholder: "Team", value: store("pointless_last_team") || "" });
    var player = el("input", { placeholder: "Player (optional)" });
    var guess = el("input", { placeholder: "Their answer" });
    app.appendChild(el("label", { text: "Team" })); app.appendChild(team);
    app.appendChild(el("label", { text: "Player" })); app.appendChild(player);
    app.appendChild(el("label", { text: "Answer" })); app.appendChild(guess);
    app.appendChild(el("div", { style: "height:12px" }));

    var stage = el("div");
    app.appendChild(el("button", {
      text: "Reveal the score",
      onclick: function () {
        if (!team.value.trim() || !guess.value.trim()) return;
        store("pointless_last_team", team.value.trim());
        rpc("pointless_record_result", {
          p_join_code: code, p_admin_key: key,
          p_team: team.value.trim(), p_player: player.value.trim() || null, p_answer: guess.value.trim()
        }).then(function (res) {
          if (!res.ok) { stage.innerHTML = ""; stage.appendChild(note("Could not record that: " + res.error, "bad")); return; }
          animateScore(stage, guess.value.trim(), res.points, res.is_pointless);
          guess.value = ""; player.value = "";
        });
      }
    }));
    app.appendChild(stage);

    var board = el("div");
    app.appendChild(board);

    rpc("pointless_get_reveal", { p_join_code: code, p_admin_key: key }).then(function (r) {
      if (!r.ok) { status.textContent = "Round status: " + (r.status || "unknown"); return; }
      status.textContent = r.topic + " \u00b7 " + r.respondents + " people answered";
      renderBoard(board, r);
    });
  }

  function animateScore(stage, answer, points, isPointless) {
    stage.innerHTML = "";
    var box = el("div", { "class": "score" + (isPointless ? " zero" : "") });
    var big = el("b", { text: "100" });
    var bar = el("div", { "class": "bar" });
    var fill = el("i");
    bar.appendChild(fill);
    box.appendChild(big);
    box.appendChild(bar);
    box.appendChild(el("em", { text: answer }));
    stage.appendChild(box);

    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) {
      big.textContent = String(points);
      fill.style.width = points + "%";
      if (isPointless) box.appendChild(note("A pointless answer.", "good"));
      return;
    }

    fill.style.width = "100%";
    var start = Date.now(), dur = 2200, from = 100;
    var timer = setInterval(function () {
      var t = Math.min(1, (Date.now() - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      var v = Math.round(from - (from - points) * eased);
      big.textContent = String(v);
      fill.style.width = v + "%";
      if (t >= 1) {
        clearInterval(timer);
        big.textContent = String(points);
        fill.style.width = points + "%";
        if (isPointless) box.appendChild(note("A pointless answer. Nobody said it.", "good"));
      }
    }, 40);
  }

  function renderBoard(board, r) {
    board.innerHTML = "";
    var scored = (r.rows || []).filter(function (x) { return x.mentions > 0; });
    var zeros = (r.rows || []).filter(function (x) { return x.mentions === 0; });

    board.appendChild(el("h2", { text: "What people said" }));
    var t = el("table");
    t.appendChild(el("tr", {}, [
      el("th", { text: "Answer" }), el("th", { text: "Said by" }), el("th", { "class": "n", text: "Score" })
    ]));
    scored.forEach(function (x) {
      t.appendChild(el("tr", {}, [
        el("td", { text: x.answer }),
        el("td", { text: x.mentions + " of " + r.respondents }),
        el("td", { "class": "n", text: String(x.score) })
      ]));
    });
    board.appendChild(t);

    board.appendChild(el("h2", { text: "Nobody said these (" + zeros.length + ")" }));
    var chips = el("div", { "class": "chips" });
    zeros.forEach(function (x) { chips.appendChild(el("span", { text: x.answer })); });
    board.appendChild(chips);
  }

  // ---------------------------------------------------------------- admin

  function viewAdmin() {
    clear();
    app.className = "wrap wide";
    var master = store("pointless_master");
    if (!master) {
      app.appendChild(el("h1", { text: "Control room" }));
      app.appendChild(el("p", { "class": "sub", text: "Paste the master key. It is stored on this device only." }));
      var m = el("input", { placeholder: "Master key" });
      app.appendChild(m);
      app.appendChild(el("div", { style: "height:12px" }));
      app.appendChild(el("button", {
        text: "Save key", onclick: function () { if (m.value.trim()) { store("pointless_master", m.value.trim()); viewAdmin(); } }
      }));
      return;
    }

    app.appendChild(el("h1", { text: "Control room" }));
    app.appendChild(el("p", { "class": "sub", text: "Build a topic, open a round, share the link, review the odd answers, reveal on the call." }));

    app.appendChild(el("h2", { text: "New topic" }));
    var tName = el("input", { placeholder: "Topic name, e.g. Premier League clubs" });
    var tList = el("textarea", { placeholder: "One valid answer per line" });
    app.appendChild(el("label", { text: "Topic name" })); app.appendChild(tName);
    app.appendChild(el("label", { text: "Every valid answer, one per line" })); app.appendChild(tList);
    app.appendChild(el("div", { style: "height:12px" }));
    var tOut = el("div");
    app.appendChild(el("button", {
      text: "Save topic", onclick: function () {
        var arr = tList.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
        rpc("pointless_admin_create_topic", { p_master_key: master, p_name: tName.value.trim(), p_answers: arr })
          .then(function (res) {
            tOut.innerHTML = "";
            tOut.appendChild(res.ok ? note("Topic saved with " + res.added + " answers.", "good") : note("Failed: " + res.error, "bad"));
          }).catch(function () { tOut.innerHTML = ""; tOut.appendChild(note("Not authorised. Check the master key.", "bad")); });
      }
    }));
    app.appendChild(tOut);

    app.appendChild(el("h2", { text: "New round" }));
    var rTopic = el("input", { placeholder: "Topic name (must match exactly)" });
    var rWeek = el("input", { placeholder: "Week number", inputmode: "numeric" });
    var rTimer = el("input", { placeholder: "Seconds", inputmode: "numeric", value: "100" });
    app.appendChild(el("label", { text: "Topic" })); app.appendChild(rTopic);
    var row = el("div", { "class": "row" });
    row.appendChild(el("div", {}, [el("label", { text: "Week" }), rWeek]));
    row.appendChild(el("div", {}, [el("label", { text: "Seconds" }), rTimer]));
    app.appendChild(row);
    app.appendChild(el("div", { style: "height:12px" }));
    var rOut = el("div");
    app.appendChild(el("button", {
      text: "Create round", onclick: function () {
        rpc("pointless_admin_create_round", {
          p_master_key: master, p_topic_name: rTopic.value.trim(),
          p_week: parseInt(rWeek.value, 10) || null, p_timer: parseInt(rTimer.value, 10) || 100
        }).then(function (res) {
          rOut.innerHTML = "";
          if (!res.ok) { rOut.appendChild(note("Failed: " + res.error, "bad")); return; }
          store("pointless_key_" + res.join_code, res.admin_key);
          var link = location.origin + location.pathname + "#/play/" + res.join_code;
          rOut.appendChild(el("div", { "class": "code", text: res.join_code }));
          rOut.appendChild(el("p", { "class": "sub", text: "Share this link, then open the round when you are ready." }));
          var linkBox = el("input", { value: link, readonly: "readonly" });
          rOut.appendChild(linkBox);
          rOut.appendChild(el("div", { style: "height:10px" }));
          rOut.appendChild(el("button", {
            text: "Copy link", "class": "ghost",
            onclick: function () { linkBox.select(); navigator.clipboard && navigator.clipboard.writeText(link); }
          }));
          rOut.appendChild(el("div", { style: "height:8px" }));
          rOut.appendChild(el("button", { text: "Open host controls", onclick: function () { go("#/host/" + res.join_code); } }));
        });
      }
    }));
    app.appendChild(rOut);

    app.appendChild(el("h2", { text: "Review odd answers" }));
    var qCode = el("input", { placeholder: "Round code" });
    app.appendChild(qCode);
    app.appendChild(el("div", { style: "height:12px" }));
    var qOut = el("div");
    app.appendChild(el("button", {
      text: "Load queue", "class": "ghost",
      onclick: function () { loadQueue(qCode.value.trim().toUpperCase(), qOut); }
    }));
    app.appendChild(qOut);

    app.appendChild(el("h2", { text: "Season table" }));
    var sOut = el("div");
    app.appendChild(sOut);
    rpc("pointless_season_table").then(function (rows) {
      sOut.innerHTML = "";
      if (!rows || !rows.length) { sOut.appendChild(el("p", { "class": "sub", text: "No results recorded yet. Lowest total wins." })); return; }
      var t = el("table");
      t.appendChild(el("tr", {}, [
        el("th", { text: "Team" }), el("th", { text: "Rounds" }), el("th", { text: "Pointless" }), el("th", { "class": "n", text: "Total" })
      ]));
      rows.forEach(function (x) {
        t.appendChild(el("tr", {}, [
          el("td", { text: x.team }), el("td", { text: String(x.rounds_played) }),
          el("td", { text: String(x.pointless_answers) }), el("td", { "class": "n", text: String(x.total) })
        ]));
      });
      sOut.appendChild(t);
      sOut.appendChild(el("p", { "class": "sub", text: "Lowest total wins." }));
    });

    app.appendChild(el("div", { style: "height:26px" }));
    app.appendChild(el("button", {
      text: "Forget keys on this device", "class": "danger",
      onclick: function () {
        Object.keys(localStorage).forEach(function (k) { if (k.indexOf("pointless_key_") === 0 || k === "pointless_master") localStorage.removeItem(k); });
        viewAdmin();
      }
    }));
  }

  function loadQueue(code, out) {
    var key = adminKeyFor(code);
    out.innerHTML = "";
    if (!key) { out.appendChild(note("No host key stored for " + code + " on this device.", "bad")); return; }
    rpc("pointless_admin_queue", { p_join_code: code, p_admin_key: key }).then(function (res) {
      out.innerHTML = "";
      if (!res.ok) { out.appendChild(note("Failed: " + res.error, "bad")); return; }
      if (!res.rows.length) { out.appendChild(el("p", { "class": "sub", text: "Nothing to review. Everything matched cleanly." })); return; }
      res.rows.forEach(function (row) {
        var card = el("div", { "class": "item" });
        card.appendChild(el("p", { text: row.raw }));
        card.appendChild(el("p", {
          "class": "muted",
          text: row.suggestion ? "Closest match: " + row.suggestion + " (" + Math.round(row.confidence * 100) + "%)" : "No close match found"
        }));
        var btns = el("div", { "class": "row" });
        if (row.suggestion) {
          btns.appendChild(el("button", {
            "class": "ghost", text: "It is " + row.suggestion,
            onclick: function () { resolve(code, key, row.id, "accept", row.suggestion_id, out); }
          }));
        }
        btns.appendChild(el("button", { "class": "ghost", text: "Add as new", onclick: function () { resolve(code, key, row.id, "new", null, out); } }));
        btns.appendChild(el("button", { "class": "danger", text: "Bin it", onclick: function () { resolve(code, key, row.id, "bin", null, out); } }));
        card.appendChild(btns);
        out.appendChild(card);
      });
    });
  }

  function resolve(code, key, id, action, canonId, out) {
    rpc("pointless_admin_resolve", {
      p_join_code: code, p_admin_key: key, p_answer_id: id, p_action: action, p_canonical_id: canonId
    }).then(function () { loadQueue(code, out); });
  }

  // ---------------------------------------------------------------- router

  function route() {
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/");
    if (parts[0] === "play" && parts[1]) return viewPlay(parts[1].toUpperCase());
    if (parts[0] === "host" && parts[1]) return viewHost(parts[1].toUpperCase());
    if (parts[0] === "admin") return viewAdmin();
    return viewHome();
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
