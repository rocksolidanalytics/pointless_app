<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pointless</title>
<style>
  :root{
    --ink:#0D1B3E; --ink2:#152551; --ink3:#1C2F63;
    --line:#2C3E72; --paper:#EEF1F8; --muted:#93A2C9;
    --gold:#F5C842; --mint:#5BE7A9; --red:#FF7A7A;
    --pad:18px;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--paper); font-family:var(--sans)}
  body{min-height:100dvh; padding:var(--pad) var(--pad) 48px; line-height:1.45}
  .wrap{max-width:560px; margin:0 auto}
  .wide{max-width:820px}
  h1{font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; margin:0 0 4px}
  h2{font-size:1.05rem; font-weight:700; margin:26px 0 10px}
  p{margin:0 0 12px}
  .sub{color:var(--muted); font-size:.92rem; margin:0 0 20px}
  .topic{font-size:2rem; font-weight:800; letter-spacing:-0.03em; line-height:1.1; margin:0 0 6px}

  input,textarea,select,button{font-family:inherit; font-size:1rem}
  input,textarea,select{width:100%; padding:13px 14px; background:var(--ink2); color:var(--paper);
    border:1px solid var(--line); border-radius:10px; outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,200,66,.18)}
  textarea{min-height:130px; resize:vertical; line-height:1.5}
  label{display:block; font-size:.85rem; color:var(--muted); margin:14px 0 6px}

  button{display:block; width:100%; padding:14px 16px; border-radius:10px; border:1px solid transparent;
    background:var(--gold); color:#231A00; font-weight:750; cursor:pointer}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{background:transparent; color:var(--paper); border-color:var(--line)}
  button.danger{background:transparent; color:var(--red); border-color:var(--line)}
  button.small{padding:9px 10px; font-size:.85rem; font-weight:650}
  .row{display:flex; gap:8px}
  .row>*{flex:1}

  .clock{display:flex; align-items:baseline; gap:10px; margin:4px 0 10px}
  .clock b{font-size:3.4rem; font-weight:800; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; line-height:1}
  .clock span{color:var(--muted); font-size:.9rem}
  .track{height:6px; background:var(--ink3); border-radius:99px; overflow:hidden; margin-bottom:18px}
  .fill{height:100%; background:var(--gold); width:100%}
  .track.low .fill{background:var(--red)}

  ul.given{list-style:none; padding:0; margin:16px 0 0; display:flex; flex-wrap:wrap; gap:8px}
  ul.given li{background:var(--ink2); border:1px solid var(--line); border-radius:99px;
    padding:7px 12px; font-size:.9rem; display:flex; align-items:center; gap:8px}
  ul.given li button{width:auto; padding:0 2px; background:none; color:var(--muted); font-weight:700; border:none}
  .count{color:var(--muted); font-size:.85rem; margin-top:14px}

  .score{text-align:center; padding:26px 0 10px}
  .score b{display:block; font-size:6.5rem; font-weight:800; letter-spacing:-0.05em; line-height:.9;
    font-variant-numeric:tabular-nums; color:var(--gold)}
  .score.zero b{color:var(--mint)}
  .score.wrong b{color:var(--red)}
  .score em{display:block; font-style:normal; color:var(--muted); font-size:.95rem; margin-top:14px}
  .bar{height:14px; background:var(--ink3); border-radius:99px; overflow:hidden; margin:20px 0 4px}
  .bar i{display:block; height:100%; background:var(--gold); width:0%}
  .score.zero .bar i{background:var(--mint)}
  .score.wrong .bar i{background:var(--red)}

  table{width:100%; border-collapse:collapse; font-size:.95rem}
  th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:.82rem}
  td.n{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chips span{background:var(--ink2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:.85rem}

  .card{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px}
  .card .head{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .card .head b{font-size:1.05rem}
  .meta{color:var(--muted); font-size:.85rem; margin:6px 0 12px}
  .badge{font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:99px; border:1px solid var(--line); white-space:nowrap}
  .badge.open{color:var(--mint); border-color:var(--mint)}
  .badge.closed{color:var(--gold); border-color:var(--gold)}
  .badge.revealed{color:var(--muted)}
  .left{font-variant-numeric:tabular-nums; font-weight:700}

  .item{border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px}
  .item p{margin:0 0 9px; font-size:.94rem}
  .item .muted{color:var(--muted); font-size:.86rem}
  .msg{border-left:3px solid var(--gold); padding:10px 0 10px 12px; margin:14px 0; font-size:.94rem}
  .msg.bad{border-color:var(--red)}
  .msg.good{border-color:var(--mint)}
  a{color:var(--gold)}
  .code{font-variant-numeric:tabular-nums; letter-spacing:.12em; font-weight:800; font-size:1.5rem}
  .foot{margin-top:34px; color:var(--muted); font-size:.82rem}
  details{border:1px solid var(--line); border-radius:10px; margin-top:12px; padding:0 13px}
  details summary{padding:13px 0; cursor:pointer; font-weight:700; list-style:none; font-size:.94rem}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:" \25be"; color:var(--muted); float:right}
  details[open] summary::after{content:" \25b4"}
  details .inner{padding-bottom:14px}
  .warn{color:var(--muted); font-size:.85rem; margin:16px 0 0}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
  var CONFIG = {
    URL: "https://grwihhxbwfcwpvyqpdkr.supabase.co",
    KEY: "sb_publishable_x8f1dkvo-EkMdBxz98vzZA_eNTrKqGN"
  };
</script>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var skew = 0;

  function rpc(fn, args) {
    return fetch(CONFIG.URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": CONFIG.KEY,
        "Authorization": "Bearer " + CONFIG.KEY
      },
      body: JSON.stringify(args || {})
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || ("HTTP " + r.status)); });
      return r.json();
    });
  }

  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
      return v;
    } catch (e) { return null; }
  }

  function deviceToken() {
    var t = store("pointless_device");
    if (!t) {
      t = "d-" + (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
      store("pointless_device", t);
    }
    return t;
  }

  function norm(s) {
    return String(s || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " and ").replace(/[-\/_+]/g, " ")
      .replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function clear() { app.innerHTML = ""; app.className = "wrap"; }
  function note(text, kind) { return el("div", { "class": "msg " + (kind || ""), text: text }); }
  function go(hash) { location.hash = hash; }
  function serverNow() { return Date.now() + skew; }

  function fmtLeft(ms) {
    if (ms <= 0) return "closed";
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h > 0) return h + "h " + (m < 10 ? "0" : "") + m + "m";
    if (m > 0) return m + "m " + (sec < 10 ? "0" : "") + sec + "s";
    return sec + "s";
  }

  function copy(text) {
    if (navigator.clipboard) navigator.clipboard.writeText(text);
  }

  function baseUrl() { return location.origin + location.pathname; }

  // ---------------------------------------------------------------- landing

  function viewHome() {
    clear();
    app.appendChild(el("h1", { text: "Pointless" }));
    app.appendChild(el("p", { "class": "sub", text: "Enter the round code from the team channel." }));
    var input = el("input", { placeholder: "Round code", autocapitalize: "characters", maxlength: "5" });
    app.appendChild(input);
    app.appendChild(el("div", { style: "height:12px" }));
    function join() { var c = input.value.trim().toUpperCase(); if (c) go("#/play/" + c); }
    app.appendChild(el("button", { text: "Join round", onclick: join }));
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
    app.appendChild(el("div", { "class": "foot" }, [
      el("a", { href: "#/admin", text: "Running the game? Open the control room." })
    ]));
  }

  // ---------------------------------------------------------------- play

  function viewPlay(code) {
    clear();
    app.appendChild(el("p", { "class": "sub", text: "Loading round " + code }));

    rpc("pointless_get_round", { p_join_code: code }).then(function (r) {
      if (!r.ok) return playClosed(code, "That code does not match any round. Check the link in the channel.");
      if (r.status === "draft") return playClosed(code, "This round has not opened yet. Try again shortly.");
      if (r.status !== "open") return playClosed(code, "Submissions are closed for this round. The answers get revealed on the call.");
      if (store("pointless_done_" + code)) return playClosed(code, "You have already played this round. One go each.");
      playIntro(code, r);
    }).catch(function () {
      playClosed(code, "Could not reach the server. Check your connection and reload.");
    });
  }

  function playClosed(code, message) {
    clear();
    app.appendChild(el("h1", { text: "Pointless" }));
    app.appendChild(el("div", { "class": "code", text: code }));
    app.appendChild(note(message));
  }

  function playIntro(code, r) {
    clear();
    app.appendChild(el("p", { "class": "sub", text: "Round " + code + (r.week ? " \u00b7 week " + r.week : "") }));
    app.appendChild(el("div", { "class": "topic", text: r.topic }));

    if (r.closes_at) {
      var left = new Date(r.closes_at).getTime() - Date.now();
      app.appendChild(el("p", { "class": "sub", text: "Entries close in " + fmtLeft(left) }));
    }

    app.appendChild(el("p", {
      text: "You get " + r.timer_seconds + " seconds to name as many as you can, straight off the top of your head. No list, no hints."
    }));
    app.appendChild(el("p", { "class": "sub",
      text: "Spelling does not need to be perfect. Your answers stay anonymous and set the scores the contestants play against." }));

    var name = el("input", { placeholder: "Your name (optional)", value: store("pointless_name") || "" });
    app.appendChild(el("label", { text: "Name, if you want the credit" }));
    app.appendChild(name);
    app.appendChild(el("div", { style: "height:16px" }));
    app.appendChild(el("button", {
      text: "Start the clock",
      onclick: function () {
        if (name.value.trim()) store("pointless_name", name.value.trim());
        playRun(code, r, name.value.trim());
      }
    }));
  }

  function playRun(code, r, displayName) {
    clear();
    var given = [];
    var endsAt = Date.now() + r.timer_seconds * 1000;
    var finished = false;

    var clockNum = el("b", { text: String(r.timer_seconds) });
    var track = el("div", { "class": "track" });
    var fill = el("i", { "class": "fill" });
    track.appendChild(fill);

    app.appendChild(el("div", { "class": "topic", text: r.topic }));
    app.appendChild(el("div", { "class": "clock" }, [clockNum, el("span", { text: "seconds left" })]));
    app.appendChild(track);

    var input = el("input", {
      placeholder: "Type an answer, then Enter",
      autocomplete: "off", autocorrect: "off", autocapitalize: "words", spellcheck: "false"
    });
    app.appendChild(input);
    app.appendChild(el("button", {
      text: "Add", "class": "ghost", style: "margin-top:8px",
      onclick: function () { add(input.value); input.focus(); }
    }));

    var list = el("ul", { "class": "given" });
    var count = el("div", { "class": "count", text: "0 answers" });
    app.appendChild(list);
    app.appendChild(count);

    var doneBtn = el("button", { text: "I am done", "class": "ghost", style: "margin-top:20px", onclick: function () { finish(); } });
    app.appendChild(doneBtn);

    function redraw() {
      list.innerHTML = "";
      given.forEach(function (g, i) {
        list.appendChild(el("li", {}, [
          el("span", { text: g }),
          el("button", { text: "\u00d7", onclick: function () { given.splice(i, 1); redraw(); input.focus(); } })
        ]));
      });
      count.textContent = given.length + (given.length === 1 ? " answer" : " answers");
    }

    function add(value) {
      var v = String(value || "").trim();
      if (!v) return;
      var n = norm(v);
      if (!n) return;
      if (given.some(function (g) { return norm(g) === n; })) { input.value = ""; return; }
      given.push(v);
      input.value = "";
      redraw();
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); add(input.value); }
    });
    setTimeout(function () { input.focus(); }, 60);

    var tick = setInterval(function () {
      var leftMs = Math.max(0, endsAt - Date.now());
      var secs = Math.ceil(leftMs / 1000);
      clockNum.textContent = String(secs);
      fill.style.width = (leftMs / (r.timer_seconds * 1000) * 100).toFixed(2) + "%";
      if (secs <= 10) track.classList.add("low"); else track.classList.remove("low");
      if (leftMs <= 0) finish();
    }, 100);

    function finish() {
      if (finished) return;
      finished = true;
      clearInterval(tick);

      clear();
      app.appendChild(el("div", { "class": "topic", text: r.topic }));
      app.appendChild(el("p", { "class": "sub", text: "Time. Sending " + given.length + (given.length === 1 ? " answer." : " answers.") }));

      rpc("pointless_submit", {
        p_join_code: code, p_device_token: deviceToken(),
        p_display_name: displayName || null, p_answers: given
      }).then(function (res) {
        clear();
        app.appendChild(el("div", { "class": "topic", text: r.topic }));
        if (res.ok) {
          store("pointless_done_" + code, "1");
          app.appendChild(note("Answers in. " + res.accepted + " counted. Scores get revealed on the call.", "good"));
        } else if (res.error === "already_submitted") {
          store("pointless_done_" + code, "1");
          app.appendChild(note("You had already played this round, so this go was not counted.", "bad"));
        } else if (res.error === "round_not_open") {
          app.appendChild(note("Entries closed while you were playing, so this go did not count.", "bad"));
        } else {
          app.appendChild(note("Something went wrong sending your answers: " + res.error, "bad"));
        }
        if (given.length) {
          var chips = el("div", { "class": "chips" });
          given.forEach(function (g) { chips.appendChild(el("span", { text: g })); });
          app.appendChild(el("h2", { text: "What you said" }));
          app.appendChild(chips);
        }
      }).catch(function () {
        clear();
        app.appendChild(note("Could not reach the server, so your answers did not send.", "bad"));
      });
    }
  }

  // ---------------------------------------------------------------- control

  function viewControl() {
    clear();
    app.className = "wrap wide";
    var master = store("pointless_master");

    if (!master) {
      app.appendChild(el("h1", { text: "Control room" }));
      app.appendChild(el("p", { "class": "sub", text: "Paste the master key. It is stored on this device only." }));
      var m = el("input", { placeholder: "Master key" });
      app.appendChild(m);
      app.appendChild(el("div", { style: "height:12px" }));
      app.appendChild(el("button", {
        text: "Save key", onclick: function () { if (m.value.trim()) { store("pointless_master", m.value.trim()); viewControl(); } }
      }));
      return;
    }

    app.appendChild(el("h1", { text: "Control room" }));

    // --- new round
    var topicSel = el("select");
    topicSel.appendChild(el("option", { value: "", text: "Loading topics..." }));
    var weekIn = el("input", { placeholder: "Week", inputmode: "numeric" });
    var winIn = el("input", { inputmode: "numeric", value: "180" });
    var timerIn = el("input", { inputmode: "numeric", value: "100" });

    app.appendChild(el("label", { text: "Topic" }));
    app.appendChild(topicSel);
    var row = el("div", { "class": "row" });
    row.appendChild(el("div", {}, [el("label", { text: "Week" }), weekIn]));
    row.appendChild(el("div", {}, [el("label", { text: "Open for (mins)" }), winIn]));
    row.appendChild(el("div", {}, [el("label", { text: "Seconds each" }), timerIn]));
    app.appendChild(row);
    app.appendChild(el("div", { style: "height:14px" }));

    var newOut = el("div");
    app.appendChild(el("button", {
      text: "Create and share", onclick: function () {
        if (!topicSel.value) { newOut.innerHTML = ""; newOut.appendChild(note("Pick a topic first.", "bad")); return; }
        rpc("pointless_admin_create_round", {
          p_master_key: master, p_topic_name: topicSel.value,
          p_week: parseInt(weekIn.value, 10) || null,
          p_timer: parseInt(timerIn.value, 10) || 100,
          p_window_minutes: parseInt(winIn.value, 10) || 180
        }).then(function (res) {
          newOut.innerHTML = "";
          if (!res.ok) { newOut.appendChild(note("Failed: " + res.error, "bad")); return; }
          var link = baseUrl() + "#/play/" + res.join_code;
          copy(link);
          store("pointless_key_" + res.join_code, res.admin_key);
          newOut.appendChild(note("Round " + res.join_code + " is open and the link is on your clipboard. Paste it into the channel.", "good"));
          newOut.appendChild(el("input", { value: link, readonly: "readonly" }));
          loadRounds();
        });
      }
    }));
    app.appendChild(newOut);

    rpc("pointless_admin_list_topics", { p_master_key: master }).then(function (res) {
      topicSel.innerHTML = "";
      if (!res.ok || !res.topics.length) { topicSel.appendChild(el("option", { value: "", text: "No topics yet" })); return; }
      res.topics.forEach(function (t) {
        topicSel.appendChild(el("option", { value: t.name, text: t.name + " (" + t.answers + ")" }));
      });
    }).catch(function () {
      topicSel.innerHTML = "";
      topicSel.appendChild(el("option", { value: "", text: "Could not load topics" }));
    });

    // --- rounds in progress
    app.appendChild(el("h2", { text: "Rounds" }));
    var roundsBox = el("div");
    app.appendChild(roundsBox);
    var clocks = [];

    function loadRounds() {
      rpc("pointless_admin_dashboard", { p_master_key: master }).then(function (res) {
        roundsBox.innerHTML = "";
        clocks = [];
        if (!res.ok) { roundsBox.appendChild(note("Could not load rounds.", "bad")); return; }
        skew = new Date(res.now).getTime() - Date.now();
        if (!res.rounds.length) { roundsBox.appendChild(el("p", { "class": "sub", text: "No rounds yet." })); return; }
        res.rounds.forEach(function (r) { roundsBox.appendChild(roundCard(r, master, loadRounds, clocks)); });
      });
    }

    loadRounds();
    setInterval(function () {
      clocks.forEach(function (c) {
        var leftMs = new Date(c.closesAt).getTime() - serverNow();
        c.node.textContent = fmtLeft(leftMs);
      });
    }, 1000);

    // --- new topic, tucked away
    var tName = el("input", { placeholder: "Topic name" });
    var tList = el("textarea", { placeholder: "One valid answer per line" });
    var tOut = el("div");
    var addTopic = el("details", {}, [
      el("summary", { text: "Add a new topic" }),
      el("div", { "class": "inner" }, [
        el("label", { text: "Topic name" }), tName,
        el("label", { text: "Every valid answer, one per line" }), tList,
        el("div", { style: "height:12px" }),
        el("button", {
          text: "Save topic", "class": "ghost", onclick: function () {
            var arr = tList.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
            rpc("pointless_admin_create_topic", { p_master_key: master, p_name: tName.value.trim(), p_answers: arr })
              .then(function (res) {
                tOut.innerHTML = "";
                tOut.appendChild(res.ok ? note("Topic saved with " + res.added + " answers.", "good") : note("Failed: " + res.error, "bad"));
                if (res.ok) viewControl();
              }).catch(function () { tOut.innerHTML = ""; tOut.appendChild(note("Not authorised.", "bad")); });
          }
        }),
        tOut
      ])
    ]);
    app.appendChild(el("div", { style: "height:24px" }));
    app.appendChild(addTopic);

    app.appendChild(el("div", { style: "height:20px" }));
    app.appendChild(el("button", {
      text: "Forget keys on this device", "class": "danger",
      onclick: function () {
        Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf("pointless_key_") === 0 || k === "pointless_master") localStorage.removeItem(k);
        });
        viewControl();
      }
    }));
  }

  function roundCard(r, master, refresh, clocks) {
    var card = el("div", { "class": "card" });
    var leftNode = el("span", { "class": "left", text: fmtLeft(new Date(r.closes_at).getTime() - serverNow()) });
    if (r.closes_at && r.status === "open") clocks.push({ node: leftNode, closesAt: r.closes_at });

    card.appendChild(el("div", { "class": "head" }, [
      el("b", { text: r.topic + (r.week ? " \u00b7 wk " + r.week : "") }),
      el("span", { "class": "badge " + r.status, text: r.status })
    ]));

    var meta = el("div", { "class": "meta" });
    meta.appendChild(el("span", { text: r.join_code + " \u00b7 " + r.respondents + " answered \u00b7 " + r.answers + " answers" }));
    if (r.status === "open") { meta.appendChild(el("span", { text: " \u00b7 " })); meta.appendChild(leftNode); }
    if (r.to_review > 0) meta.appendChild(el("span", { text: " \u00b7 " + r.to_review + " to check" }));
    card.appendChild(meta);

    var btns = el("div", { "class": "row" });
    btns.appendChild(el("button", {
      "class": "ghost small", text: "Copy link",
      onclick: function () { copy(baseUrl() + "#/play/" + r.join_code); }
    }));
    btns.appendChild(el("button", {
      "class": "ghost small", text: "Present",
      onclick: function () { go("#/show/" + r.join_code + "/" + r.admin_key); }
    }));
    if (r.status === "open") {
      btns.appendChild(el("button", {
        "class": "ghost small", text: "Close now",
        onclick: function () {
          rpc("pointless_admin_set_status", { p_join_code: r.join_code, p_admin_key: master, p_status: "closed" }).then(refresh);
        }
      }));
    } else {
      btns.appendChild(el("button", {
        "class": "ghost small", text: "+60 min",
        onclick: function () {
          rpc("pointless_admin_extend", { p_master_key: master, p_join_code: r.join_code, p_minutes: 60 }).then(function () {
            rpc("pointless_admin_set_status", { p_join_code: r.join_code, p_admin_key: master, p_status: "open" }).then(refresh);
          });
        }
      }));
    }
    card.appendChild(btns);

    var delBtn = el("button", { "class": "danger small", text: "Delete round", style: "margin-top:8px" });
    var armed = false, armTimer = null;
    delBtn.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        delBtn.textContent = "Tap again to delete " + r.join_code + " and its answers";
        armTimer = setTimeout(function () {
          armed = false;
          delBtn.textContent = "Delete round";
        }, 5000);
        return;
      }
      clearTimeout(armTimer);
      delBtn.disabled = true;
      delBtn.textContent = "Deleting";
      rpc("pointless_admin_delete_round", { p_master_key: master, p_join_code: r.join_code })
        .then(function () { refresh(); })
        .catch(function () {
          delBtn.disabled = false;
          armed = false;
          delBtn.textContent = "Delete failed, tap to retry";
        });
    });
    card.appendChild(delBtn);

    var inner = el("div", { "class": "inner" });
    var det = el("details", {}, [
      el("summary", { text: "Answers so far" + (r.to_review > 0 ? " (" + r.to_review + " need a decision)" : "") }),
      inner
    ]);
    det.addEventListener("toggle", function () {
      if (!det.open || inner.dataset.loaded) return;
      inner.dataset.loaded = "1";
      inner.appendChild(el("p", { "class": "sub", text: "Loading" }));
      rpc("pointless_admin_round_detail", { p_master_key: master, p_join_code: r.join_code }).then(function (res) {
        inner.innerHTML = "";
        if (!res.ok || !res.rows.length) { inner.appendChild(el("p", { "class": "sub", text: "Nothing submitted yet." })); return; }
        var needs = res.rows.filter(function (x) { return x.status !== "resolved"; });
        var fine = res.rows.filter(function (x) { return x.status === "resolved"; });

        if (needs.length) {
          inner.appendChild(el("p", { "class": "sub", text: "These need a decision" }));
          needs.forEach(function (x) { inner.appendChild(reviewItem(x, r, master, refresh)); });
        }
        inner.appendChild(el("p", { "class": "sub", text: fine.length + " answers matched cleanly" }));
        var chips = el("div", { "class": "chips" });
        fine.forEach(function (x) {
          chips.appendChild(el("span", { text: x.raw + (norm(x.raw) === norm(x.resolved_to || "") ? "" : " \u2192 " + x.resolved_to) }));
        });
        inner.appendChild(chips);
      });
    });
    card.appendChild(det);

    var lbInner = el("div", { "class": "inner" });
    var lbDet = el("details", {}, [el("summary", { text: "Who did best" }), lbInner]);
    lbDet.addEventListener("toggle", function () {
      if (!lbDet.open || lbInner.dataset.loaded) return;
      lbInner.dataset.loaded = "1";
      lbInner.appendChild(el("p", { "class": "sub", text: "Loading" }));
      rpc("pointless_admin_leaderboard", { p_master_key: master, p_join_code: r.join_code })
        .then(function (res) {
          lbInner.innerHTML = "";
          if (!res.ok) { lbInner.appendChild(note("Could not load that.", "bad")); return; }
          if (!res.rows.length) {
            lbInner.appendChild(el("p", { "class": "sub",
              text: res.anonymous ? "All " + res.anonymous + " played anonymously, so there is nobody to rank."
                                  : "Nobody has answered yet." }));
            return;
          }
          var top = res.rows[0], bottom = res.rows[res.rows.length - 1];
          lbInner.appendChild(el("p", { text: "Most valid answers: " + top.name + " with " + top.valid }));
          if (res.rows.length > 1 && bottom.valid !== top.valid) {
            lbInner.appendChild(el("p", { text: "Fewest: " + bottom.name + " with " + bottom.valid }));
          }
          var lt = el("table");
          lt.appendChild(el("tr", {}, [
            el("th", { text: "Name" }), el("th", { "class": "n", text: "Valid" }), el("th", { "class": "n", text: "Typed" })
          ]));
          res.rows.forEach(function (x) {
            lt.appendChild(el("tr", {}, [
              el("td", { text: x.name }),
              el("td", { "class": "n", text: String(x.valid) }),
              el("td", { "class": "n", text: String(x.submitted) })
            ]));
          });
          lbInner.appendChild(lt);
          if (res.anonymous) {
            lbInner.appendChild(el("p", { "class": "sub",
              text: res.anonymous + " played anonymously and are not ranked." }));
          }
        });
    });
    card.appendChild(lbDet);

    return card;
  }

  function reviewItem(x, r, master, refresh) {
    var item = el("div", { "class": "item" });
    item.appendChild(el("p", { text: x.raw }));
    item.appendChild(el("p", {
      "class": "muted",
      text: x.resolved_to ? "Closest match: " + x.resolved_to + " (" + Math.round((x.confidence || 0) * 100) + "%)" : "No close match"
    }));
    var b = el("div", { "class": "row" });
    function act(action, canonId) {
      rpc("pointless_admin_resolve", {
        p_join_code: r.join_code, p_admin_key: master, p_answer_id: x.id,
        p_action: action, p_canonical_id: canonId || null
      }).then(function () { item.remove(); refresh(); });
    }
    if (x.resolved_to) b.appendChild(el("button", { "class": "ghost small", text: "It is " + x.resolved_to, onclick: function () { act("accept", x.suggestion_id); } }));
    b.appendChild(el("button", { "class": "ghost small", text: "Add as new", onclick: function () { act("new"); } }));
    b.appendChild(el("button", { "class": "danger small", text: "Bin", onclick: function () { act("bin"); } }));
    item.appendChild(b);
    return item;
  }

  // ---------------------------------------------------------------- present

  function viewShow(code, key) {
    clear();
    app.className = "wrap";
    if (key) store("pointless_key_" + code, key);
    var adminKey = key || store("pointless_key_" + code) || store("pointless_master");
    if (!adminKey) {
      app.appendChild(note("No key for round " + code + " on this device. Open it from the control room.", "bad"));
      return;
    }

    var head = el("p", { "class": "sub", text: "Loading" });
    app.appendChild(head);

    var guess = el("input", {
      placeholder: "Type the answer", autocomplete: "off", autocapitalize: "words", spellcheck: "false"
    });
    app.appendChild(guess);
    app.appendChild(el("div", { style: "height:12px" }));
    var stage = el("div");

    function reveal() {
      var a = guess.value.trim();
      if (!a) return;
      rpc("pointless_score_answer", { p_join_code: code, p_admin_key: adminKey, p_answer: a })
        .then(function (res) {
          if (!res.ok) { stage.innerHTML = ""; stage.appendChild(note("Could not check that: " + res.error, "bad")); return; }
          if (!res.matched) { verdict(a); return; }
          animateScore(stage, res.matched, res.points, res.is_pointless ? "pointless" : "normal", res.mentions, res.respondents);
          guess.value = "";
        });
    }

    function verdict(a) {
      stage.innerHTML = "";
      stage.appendChild(note("\u201c" + a + "\u201d is not on the answer list. Wrong answer, or one you forgot to add?", "bad"));
      var choice = el("div", { "class": "row" });
      choice.appendChild(el("button", {
        "class": "ghost", text: "Wrong answer",
        onclick: function () { animateScore(stage, a, 100, "wrong"); guess.value = ""; }
      }));
      choice.appendChild(el("button", {
        "class": "ghost", text: "It is valid, add it",
        onclick: function () {
          rpc("pointless_admin_add_answer", { p_join_code: code, p_admin_key: adminKey, p_answer: a })
            .then(function (res2) {
              if (!res2.ok) { stage.innerHTML = ""; stage.appendChild(note("Could not add that: " + res2.error, "bad")); return; }
              animateScore(stage, res2.matched, res2.points, res2.is_pointless ? "pointless" : "normal",
                res2.mentions, res2.respondents, res2.rescored);
              guess.value = "";
            });
        }
      }));
      stage.appendChild(choice);
    }

    guess.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); reveal(); } });
    app.appendChild(el("button", { text: "Reveal the score", onclick: reveal }));
    app.appendChild(stage);

    var finale = el("div");
    app.appendChild(finale);

    rpc("pointless_get_reveal", { p_join_code: code, p_admin_key: adminKey }).then(function (r) {
      if (!r.ok) { head.textContent = "Round " + code + " \u00b7 " + (r.error || ""); return; }
      head.textContent = r.topic + " \u00b7 " + r.respondents + " people answered";
      var zeros = (r.rows || []).filter(function (x) { return x.mentions === 0; });
      finale.appendChild(el("p", { "class": "warn", text: "The list below stays shut until you open it, so this screen is safe to share." }));
      var chips = el("div", { "class": "chips" });
      zeros.forEach(function (x) { chips.appendChild(el("span", { text: x.answer })); });
      finale.appendChild(el("details", {}, [
        el("summary", { text: "The pointless answers (" + zeros.length + ")" }),
        el("div", { "class": "inner" }, [chips])
      ]));
    });
  }

  function animateScore(stage, answer, points, kind, mentions, respondents, rescored) {
    function tally(box) {
      if (kind === "wrong") { box.appendChild(note("Not a valid answer. Automatic 100.", "bad")); return; }
      box.appendChild(note(kind === "pointless"
        ? "Nobody said it. A pointless answer."
        : mentions + " of " + respondents + " people said it.", kind === "pointless" ? "good" : ""));
      if (rescored) {
        box.appendChild(note("Added to the list. " + rescored +
          (rescored === 1 ? " earlier answer" : " earlier answers") + " re-counted against it.", ""));
      }
    }
    stage.innerHTML = "";
    var box = el("div", { "class": "score" + (kind === "pointless" ? " zero" : kind === "wrong" ? " wrong" : "") });
    var big = el("b", { text: "100" });
    var bar = el("div", { "class": "bar" });
    var fill = el("i");
    bar.appendChild(fill);
    box.appendChild(big);
    box.appendChild(bar);
    box.appendChild(el("em", { text: answer }));
    stage.appendChild(box);

    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) {
      big.textContent = String(points);
      fill.style.width = points + "%";
      tally(box);
      return;
    }

    fill.style.width = "100%";
    var start = Date.now(), dur = 2200, from = 100;
    var timer = setInterval(function () {
      var t = Math.min(1, (Date.now() - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      var v = Math.round(from - (from - points) * eased);
      big.textContent = String(v);
      fill.style.width = v + "%";
      if (t >= 1) {
        clearInterval(timer);
        big.textContent = String(points);
        fill.style.width = points + "%";
        tally(box);
      }
    }, 40);
  }

  // ---------------------------------------------------------------- router

  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    if (parts[0] === "play" && parts[1]) return viewPlay(parts[1].toUpperCase());
    if (parts[0] === "show" && parts[1]) return viewShow(parts[1].toUpperCase(), parts[2] || null);
    if (parts[0] === "host" && parts[1]) return viewShow(parts[1].toUpperCase(), null);
    if (parts[0] === "admin") return viewControl();
    return viewHome();
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
